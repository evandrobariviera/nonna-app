version: '3.8'

# Stack do Portainer — Nonna App
# Deploy: Portainer > Stacks > Add stack > Upload este arquivo
# Variáveis de ambiente: configurar em "Environment variables" no Portainer

services:
  app:
    image: ghcr.io/evandrobariviera/nonna-app:latest
    restart: unless-stopped
    environment:
      APP_NAME: "Nonna App"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: https://app.nonnaagenciadigital.com.br
      APP_DOMAIN: nonnaagenciadigital.com.br

      DB_CONNECTION: pgsql
      DB_HOST: 10.0.0.3          # IP privado do servidor de banco
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      SESSION_DRIVER: database
      SESSION_DOMAIN: .nonnaagenciadigital.com.br
      SESSION_LIFETIME: 480

      CACHE_STORE: database
      QUEUE_CONNECTION: database

      FILESYSTEM_DISK: r2
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET}
      CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT}
      CLOUDFLARE_R2_PUBLIC_URL: ${CLOUDFLARE_R2_PUBLIC_URL}

      IMPORT_SECRET: ${IMPORT_SECRET}

      LOG_CHANNEL: stderr
      LOG_LEVEL: error

    networks:
      - nonna-project-02-manager
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      # start_period generoso de propósito (2026-07-24): o entrypoint.sh faz espera de
      # banco (até 60s) + migrate + 2 seeders + 4 rebuilds de cache ANTES do nginx sequer
      # começar a escutar — 90s estourava fácil num servidor compartilhado com outras 13
      # stacks, fazendo o healthcheck falhar prematuramente e disparar failure_action:
      # rollback (outro ciclo de start/stop por cima do que já estava rolando — daí os
      # 15-20min de gateway timeout reportados). Se ainda estourar, o próximo passo é
      # medir no log do container qual etapa específica do entrypoint está lenta.
      start_period: 240s
    deploy:
      replicas: 1
      # Fixo no manager de propósito (incidente 2026-08-17): a rede overlay do
      # Swarm entre o node "nonna-project-01-database" e o Traefik (que roda
      # no manager) está quebrada — toda vez que o Swarm reagendava o
      # container pra lá, o container ficava saudável por dentro mas
      # inalcançável de fora, e o site caía. Enquanto isso não for corrigido
      # na infra (rede overlay entre os dois nodes), manter fixo aqui evita
      # repetir o incidente. Se um dia precisar rodar em mais de 1 réplica ou
      # tirar essa trava, resolver a rede overlay primeiro.
      placement:
        constraints:
          - node.hostname==nonna-project-02-manager
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first       # sobe novo antes de derrubar o atual (zero downtime)
        failure_action: rollback
        monitor: 300s            # sempre > start_period + 1 retry, senão o Swarm pode concluir o update antes do healthcheck ter chance real de passar
      restart_policy:
        # "on-failure" só reinicia em saída com erro — se o container sair
        # limpo (code 0) sem um substituto assumir de verdade, o serviço fica
        # travado em zero réplicas até alguém forçar manualmente (achado real,
        # 2026-07-30: os dois containers do serviço apareciam "exited - code
        # 0" durante um timeout de produção). "any" reinicia sempre, é o
        # recomendado pra serviço que deve ficar sempre no ar.
        condition: any
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.nonna-app.rule=Host(`app.nonnaagenciadigital.com.br`)"
        - "traefik.http.routers.nonna-app.entrypoints=websecure"
        - "traefik.http.routers.nonna-app.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.nonna-app.loadbalancer.server.port=80"
        # Redirect HTTP → HTTPS
        - "traefik.http.routers.nonna-app-http.rule=Host(`app.nonnaagenciadigital.com.br`)"
        - "traefik.http.routers.nonna-app-http.entrypoints=web"
        - "traefik.http.routers.nonna-app-http.middlewares=https-redirect"

networks:
  nonna-project-02-manager:
    name: nonna-project-02-manager
    external: true
