name: Deploy → Produção

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/evandrobariviera/nonna-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A cada deploy o Swarm baixa a imagem nova mas nunca apaga a antiga no
      # próprio servidor — ela fica órfã (dangling, tag <none>) e nunca mais
      # sai de lá. `docker image prune -f` só remove imagens sem tag e sem
      # nenhum container usando (nunca a que o container em transição ainda
      # usa), então é seguro rodar logo depois do update.
      #
      # `--detach=false` é o ponto importante aqui: por padrão o
      # `docker service update` só REGISTRA a atualização e retorna na hora,
      # sem esperar o container novo subir/passar no healthcheck/o antigo
      # descer — por isso o job sempre "terminava rápido" mesmo quando a
      # troca de verdade no servidor levava minutos depois disso, invisível
      # no log do Actions. Com --detach=false o comando fica preso até o
      # Swarm convergir de verdade (ou desistir e reverter, graças ao
      # failure_action: rollback do docker-compose.prod.yml) — assim o tempo
      # que aparece aqui já é o tempo real do deploy.
      - name: Deploy no Swarm via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/evandrobariviera/nonna-app:latest
            echo "=== Início da atualização do serviço: $(date -u +%H:%M:%S) ==="
            docker service update \
              --image ghcr.io/evandrobariviera/nonna-app:latest \
              --with-registry-auth \
              --detach=false \
              nonna-app_app
            echo "=== Serviço convergido: $(date -u +%H:%M:%S) ==="
            docker image prune -f

      # Cada push cria uma tag `sha-<commit>` nova (além de `latest`) e nada
      # nunca apagava as antigas — acumulou 225+ versões no ghcr.io. Mantém só
      # as mais recentes (a mais nova, com `latest`, sempre fica).
      - name: Limpar versões antigas da imagem no ghcr.io
        uses: actions/delete-package-versions@v5
        with:
          package-name: nonna-app
          package-type: container
          min-versions-to-keep: 10
