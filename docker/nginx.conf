user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout combined;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 200M;
    client_body_temp_path /tmp/nginx_client_body;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Assets compilados com cache longo
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            # 300s pra acompanhar o set_time_limit(300) do zip de entregáveis
            # (TaskAttachmentController::downloadDeliverablesZip) — senão o nginx corta a
            # conexão antes do PHP, mesma corrupção de arquivo por outro caminho.
            fastcgi_read_timeout 300;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
